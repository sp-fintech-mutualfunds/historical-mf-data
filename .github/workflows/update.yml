name: Update Data
on:
  schedule:
    # Run cron every 12 hours.
    - cron: '* */12 * * *'
jobs:
  update:
    name: Update data
    runs-on: ubuntu-latest
    steps:
    - name: Get current date
      uses: josStorer/get-current-time@v2
      id: current-time
      with:
        format: "YYYYMMDD"
        timezone: 'Asia/Kolkata'
    - uses: actions/checkout@v3
      name: Checkout Sp Branch
      with:
        fetch-depth: 1
        ref: 'sp'
    - name: Evaluate data directory before fetch
      run: ./genrel.sh beforefetch
    - name: Fetch data from AMFI Website
      run: ./genrel.sh fetch
    - name: Evaluate data directory after fetch
      run: ./genrel.sh afterfetch
    - uses: stefanzweifel/git-auto-commit-action@v4
      id: commit
      with:
        commit_message: Update Historical Data
        commit_author: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'
    - uses: actions/setup-python@v4
      with:
        python-version: 'pypy3.9'
    - name: Create funds dataset and generate release
      run: ./genrel.sh fundsdataset
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
